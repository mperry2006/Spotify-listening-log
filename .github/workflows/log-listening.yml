name: Log Spotify listening

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: spotify-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch recent plays
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python spotify_logger.py

      - name: Update listening report
        run: python analyze.py

      # Covers refresh once a day (10am ET) or when you click "Run workflow".
      # If it fails, the rest of the run still goes through.
      - name: Download album covers
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%H)" = "15" ]; then
            python fetch_covers.py
          else
            echo "Not cover time - skipping."
          fi

      # Artist photos for the newsletter, from Wikipedia. Same schedule as covers.
      - name: Download artist photos
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%H)" = "15" ]; then
            python fetch_photos.py
          else
            echo "Not photo time - skipping."
          fi

      - name: Commit new data
        run: |
          git config user.name "spotify-logger"
          git config user.email "spotify-logger@users.noreply.github.com"
          git add data reports
          if [ -d covers ]; then git add -A covers; fi
          if [ -d photos ]; then git add -A photos; fi
          if git diff --cached --quiet; then
            echo "No new plays."
          else
            git commit -m "Log plays $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
